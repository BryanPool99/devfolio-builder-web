<section class="dashboard">
  <h1>Mi portafolio</h1>

  @if (loading()) {
    <div class="state">
      <mat-spinner diameter="40" />
    </div>
  } @else if (error()) {
    <div class="state error" role="alert">
      <mat-icon>error_outline</mat-icon>
      <p>{{ error() }}</p>
    </div>
  } @else if (data(); as me) {
    <div class="cards">
      <mat-card>
        <mat-card-header>
          <mat-icon mat-card-avatar>person</mat-icon>
          <mat-card-title>{{ me.user.username }}</mat-card-title>
          <mat-card-subtitle>{{ me.user.email }}</mat-card-subtitle>
        </mat-card-header>
      </mat-card>

      <mat-card>
        <mat-card-header>
          <mat-icon mat-card-avatar>web</mat-icon>
          <mat-card-title>{{ me.portfolio.title }}</mat-card-title>
          <mat-card-subtitle>Tu portafolio</mat-card-subtitle>
        </mat-card-header>
        <mat-card-actions>
          <!-- TODO Fase 2: link real al editor de bloques -->
          <a mat-button color="primary" routerLink="/">Editar portafolio</a>
        </mat-card-actions>
      </mat-card>
    </div>
  }
</section>
